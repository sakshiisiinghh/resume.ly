name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resumely
          POSTGRES_PASSWORD: resumely
          POSTGRES_DB: resumely_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resumely"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      s3:
        image: adobe/s3mock
        env:
          initialBuckets: resumely-test
        ports:
          - 9090:9090

    env:
      TEST_DATABASE_URL: postgres://resumely:resumely@localhost:5432/resumely_test
      TEST_REDIS_URL: redis://localhost:6379
      TEST_S3_ENDPOINT: http://localhost:9090
      TEST_S3_ACCESS_KEY_ID: test
      TEST_S3_SECRET_ACCESS_KEY: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Starts the production build and checks the headers and CSP a real browser depends on.
      - run: npm run smoke
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          REDIS_URL: ${{ env.TEST_REDIS_URL }}
          SESSION_SECRET: ci-smoke-test-secret-long-enough-to-pass

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target app -t resumely-app .
      - run: docker build --target worker -t resumely-worker .
      - run: docker build --target combined -t resumely-combined .
